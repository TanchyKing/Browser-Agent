<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cross Page Target</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Cross Page Target</h1></header>
  <main>
    <section class="panel">
      <label for="project-code-input">Project code</label>
      <input id="project-code-input" data-testid="project-code-input">
      <button id="confirm-code" data-testid="confirm-code" onclick="confirmCode()">Confirm code</button>
      <div id="code-status" data-testid="code-status" class="result">Waiting</div>
    </section>
  </main>
  <script>
    function confirmCode() {
      document.getElementById('code-status').textContent = document.getElementById('project-code-input').value === 'PX-4172' ? 'PX-4172 confirmed' : 'Mismatch';
    }
  </script>
</body>
</html>
