<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Enrollment Variant</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Enrollment</h1><section class="panel">
<label>Dependents<input data-testid="family-size" type="number"></label><label>Plan<select data-testid="coverage-tier"><option>Basic</option><option>Standard</option></select></label><label>Employee<input data-testid="member-name"></label>
<button data-testid="commit-enrollment" onclick="save()">Save</button><div data-testid="enrollment-result">Not saved</div></section></main>
<script>function save(){const q=s=>document.querySelector(`[data-testid='${s}']`).value;document.querySelector('[data-testid="enrollment-result"]').textContent=[q('member-name'),q('coverage-tier'),q('family-size')].join('|');}</script></body></html>
