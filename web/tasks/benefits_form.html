<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Benefits Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Benefits Form</h1></header>
  <main>
    <section class="panel grid">
      <div><label for="employee-name">Employee name</label><input id="employee-name" data-testid="employee-name"></div>
      <div><label for="plan">Plan</label><select id="plan" data-testid="plan"><option>Basic</option><option>Standard</option><option>Premium</option></select></div>
      <div><label for="dependent-count">Dependents</label><input id="dependent-count" data-testid="dependent-count" type="number"></div>
    </section>
    <section class="panel">
      <button id="save-benefits" data-testid="save-benefits" onclick="saveBenefits()">Save draft</button>
      <div id="benefits-summary" data-testid="benefits-summary" class="result">No draft</div>
    </section>
  </main>
  <script>
    function saveBenefits() {
      document.getElementById('benefits-summary').textContent = document.getElementById('employee-name').value + '|' + document.getElementById('plan').value + '|' + document.getElementById('dependent-count').value;
    }
  </script>
</body>
</html>
