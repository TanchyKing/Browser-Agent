<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Role Board Variant</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Role Board</h1><section class="panel">
<label>Role<select data-testid="role-choice"><option>All</option><option>Product Analyst</option></select></label>
<label>Work mode<select data-testid="work-mode"><option>All</option><option>Hybrid</option></select></label>
<label>Level<select data-testid="career-level"><option>All</option><option>Senior</option></select></label>
<button data-testid="apply-role-filters" onclick="applyFilters()">Apply</button>
<div data-testid="result-total">5</div></section></main>
<script>function applyFilters(){const values=['role-choice','work-mode','career-level'].map(x=>document.querySelector(`[data-testid='${x}']`).value);document.querySelector('[data-testid="result-total"]').textContent=values.join('|')==='Product Analyst|Hybrid|Senior'?'2':'0';}</script></body></html>
