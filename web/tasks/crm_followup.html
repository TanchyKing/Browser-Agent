<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CRM Follow-up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>CRM Follow-up Note</h1></header>
  <main>
    <section class="panel">
      <p><strong>Account:</strong> Harbor Labs</p>
      <p><strong>Latest ticket:</strong> Needs invoice copy and renewal call.</p>
      <label for="followup-note">Follow-up note</label>
      <textarea id="followup-note" data-testid="followup-note" rows="4"></textarea>
      <button id="save-note" data-testid="save-note" onclick="saveNote()">Save note</button>
    </section>
    <section class="panel">
      <h2>Saved note</h2>
      <div id="saved-note" data-testid="saved-note" class="result">None</div>
    </section>
  </main>
  <script>
    function saveNote() {
      document.getElementById('saved-note').textContent = document.getElementById('followup-note').value;
    }
  </script>
</body>
</html>
