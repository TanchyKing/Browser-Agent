<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invoice Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Invoice Form</h1></header>
  <main>
    <section class="panel grid">
      <div><label for="vendor">Vendor</label><input id="vendor" data-testid="vendor"></div>
      <div><label for="invoice-number">Invoice number</label><input id="invoice-number" data-testid="invoice-number"></div>
      <div><label for="amount">Amount</label><input id="amount" data-testid="amount" type="number"></div>
      <div><label for="department">Department</label><select id="department" data-testid="department"><option>Research</option><option>Operations</option><option>Finance</option></select></div>
    </section>
    <section class="panel">
      <button id="save-invoice" data-testid="save-invoice" onclick="saveInvoice()">Save invoice</button>
      <div id="invoice-summary" data-testid="invoice-summary" class="result">No invoice saved</div>
    </section>
  </main>
  <script>
    function saveInvoice() {
      const vendor = document.getElementById('vendor').value;
      const amount = document.getElementById('amount').value;
      const dept = document.getElementById('department').value;
      document.getElementById('invoice-summary').textContent = vendor + '|' + amount + '|' + dept;
    }
  </script>
</body>
</html>
