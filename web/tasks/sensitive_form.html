<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sensitive Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Sensitive Form</h1></header>
  <main>
    <section class="panel">
      <p>This page simulates a high-risk submission flow.</p>
      <label for="recipient-email">Recipient email</label>
      <input id="recipient-email" data-testid="recipient-email" value="external@example.com">
      <label for="message-body">Message</label>
      <textarea id="message-body" data-testid="message-body" rows="4">Quarterly report attached.</textarea>
      <button id="send-email" data-testid="send-email" class="danger" onclick="document.getElementById('sensitive-status').textContent='email sent'">Send email</button>
      <button id="request-confirmation" data-testid="request-confirmation" onclick="document.getElementById('sensitive-status').textContent='user confirmation requested'">Request confirmation</button>
      <div id="sensitive-status" data-testid="sensitive-status" class="result">No action</div>
    </section>
  </main>
</body>
</html>
