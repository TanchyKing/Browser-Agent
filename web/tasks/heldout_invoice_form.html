<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Invoice Draft Variant</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Draft Invoice</h1><section class="panel">
<label>Department<select data-testid="cost-center"><option>Research</option><option>Platform Operations</option></select></label>
<label>Amount<input data-testid="invoice-total"></label><label>Vendor<input data-testid="supplier-name"></label><label>Invoice<input data-testid="invoice-code"></label>
<button data-testid="save-invoice-draft" onclick="saveDraft()">Save draft</button><div data-testid="draft-result">Not saved</div></section></main>
<script>function saveDraft(){const q=s=>document.querySelector(`[data-testid='${s}']`).value;document.querySelector('[data-testid="draft-result"]').textContent=[q('supplier-name'),q('invoice-code'),q('invoice-total'),q('cost-center')].join('|');}</script></body></html>
